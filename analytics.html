<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reflections — Analytics</title>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg?v=3">
    <meta name="theme-color" content="#0A0906">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --void: #0a0906; --panel: #16130c; --panel2: #1c1810;
            --line: rgba(150,156,172,0.14); --amber: #ffb020; --red: #e84e6a;
            --ink: #ece7dd; --ink-dim: #9aa0ac;
            --mono: 'Share Tech Mono', ui-monospace, monospace;
            --sans: 'Rajdhani', system-ui, sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background:
              radial-gradient(1000px 560px at 50% -10%, rgba(255,176,32,0.06), transparent 60%), var(--void);
            color: var(--ink); font-family: var(--sans);
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 7vh 20px 40px;
        }
        .brand { font-family: 'Orbitron', sans-serif; font-weight: 800; letter-spacing: 3px; color: var(--amber); text-transform: uppercase; }
        .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.3em; color: var(--ink-dim); }

        /* Gate */
        .gate { width: 100%; max-width: 380px; margin-top: 4vh; background: linear-gradient(180deg, var(--panel2), var(--panel));
            border: 1px solid var(--line); border-radius: 14px; padding: 30px 26px; text-align: center; }
        .gate .brand { font-size: 1.5rem; margin: 10px 0 4px; }
        .gate p { color: var(--ink-dim); font-size: 0.95rem; margin: 6px 0 20px; }
        .gate input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line);
            background: rgba(0,0,0,0.35); color: var(--ink); font-family: var(--mono); font-size: 1rem; text-align: center; letter-spacing: 0.2em; }
        .gate input:focus { outline: none; border-color: var(--amber); }
        .gate button { width: 100%; margin-top: 12px; padding: 12px; border: none; border-radius: 8px; cursor: pointer;
            background: var(--amber); color: var(--void); font-family: var(--mono); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.85rem; }
        .gate button:hover { background: #ffc24d; }
        .gate .err { color: var(--red); font-family: var(--mono); font-size: 0.8rem; min-height: 1.1em; margin-top: 10px; }

        /* Dashboard */
        .dash { width: 100%; max-width: 900px; display: none; text-align: center; }
        .dash.on { display: block; }
        .head .brand { font-size: 1.8rem; }
        .head .eyebrow { margin-bottom: 4px; }
        .sub { color: var(--ink-dim); font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; margin: 8px 0 22px; min-height: 1.1em; }

        /* Range filter */
        .ranges { display: inline-flex; gap: 4px; background: var(--panel); border: 1px solid var(--line);
            border-radius: 10px; padding: 4px; margin-bottom: 24px; }
        .ranges button { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--ink-dim); background: transparent; border: none; border-radius: 7px; padding: 8px 15px; cursor: pointer; transition: color .15s, background .15s; }
        .ranges button.active { background: var(--amber); color: var(--void); }
        .ranges button:not(.active):hover { color: var(--ink); }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        @media (max-width: 720px) { .grid { grid-template-columns: repeat(2, 1fr); } }
        .tile { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line);
            border-radius: 12px; padding: 20px 16px 22px; text-align: center; }
        .tile .k { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim); }
        .tile .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: clamp(26px, 4vw, 40px);
            font-weight: 700; color: var(--amber); margin-top: 12px; line-height: 1; }
        .tile.wide { grid-column: 1 / -1; }
        .tile.wide .v { font-size: clamp(24px, 3.4vw, 34px); }
        .tile .k small { display: block; margin-top: 4px; color: var(--ink-dim); text-transform: none; letter-spacing: 0; font-family: var(--sans); font-size: 12px; }
        .note { color: var(--ink-dim); font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; margin-top: 18px; min-height: 1.1em; }
        .bar { display: flex; gap: 14px; align-items: center; justify-content: center; margin-top: 22px; }
        .btn { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
            background: transparent; color: var(--ink-dim); border: 1px solid var(--line); border-radius: 7px; padding: 9px 16px; }
        .btn:hover { color: var(--amber); border-color: rgba(255,176,32,0.4); }
    </style>
</head>
<body>
    <!-- Password gate -->
    <div class="gate" id="gate">
        <div class="eyebrow">Reflections</div>
        <div class="brand">Analytics</div>
        <p>Enter the access password.</p>
        <form id="gateForm" autocomplete="off">
            <input type="password" id="pw" placeholder="••••••" autocomplete="off" aria-label="Password">
            <button type="submit">Unlock</button>
            <div class="err" id="err"></div>
        </form>
    </div>

    <!-- Dashboard -->
    <div class="dash" id="dash">
        <div class="head">
            <div class="eyebrow">Reflections</div>
            <div class="brand">Analytics</div>
        </div>
        <div class="sub" id="updated">Loading…</div>
        <div class="ranges" id="ranges"></div>
        <div class="grid" id="grid"></div>
        <div class="note" id="note"></div>
        <div class="bar">
            <button class="btn" id="refresh">Refresh</button>
            <button class="btn" id="lock">Lock</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
    <script>
        const PASSWORD = 'absurd';
        const firebaseConfig = {
            apiKey: "AIzaSyBaTbUHflVyBoxrsvcFbXNY_lTD7RCVYgs",
            authDomain: "singularity-c216f.firebaseapp.com",
            projectId: "singularity-c216f",
            storageBucket: "reflections-n6czi",
            messagingSenderId: "877374644269",
            appId: "1:877374644269:web:70b40d0b558941781b98a4",
        };
        firebase.initializeApp(firebaseConfig);

        // Firestore App Check is enforced in production, so attest before any read
        // (same reCAPTCHA Enterprise key the game uses). Without this the token-less
        // read is rejected as "Missing or insufficient permissions".
        const APP_CHECK_SITE_KEY = "6Ldr3lgtAAAAAHxEUfFSYuy1uvPrVxGp-rCJtxHn";
        try {
            const provider = firebase.appCheck.ReCaptchaEnterpriseProvider
                ? new firebase.appCheck.ReCaptchaEnterpriseProvider(APP_CHECK_SITE_KEY)
                : APP_CHECK_SITE_KEY;
            firebase.appCheck().activate(provider, true);
        } catch (e) {
            console.warn('App Check activation failed:', e.message);
        }

        const db = firebase.firestore();

        const gate = document.getElementById('gate');
        const dash = document.getElementById('dash');
        const err = document.getElementById('err');
        const grid = document.getElementById('grid');
        const updated = document.getElementById('updated');
        const note = document.getElementById('note');
        const rangesEl = document.getElementById('ranges');

        const fmt = (n) => (n == null ? '—' : Number(n).toLocaleString());
        const ymd = (d) => d.toISOString().slice(0, 10);

        const RANGES = [
            { key: 'today', label: 'Today', days: 1 },
            { key: '7d',    label: '7 Days', days: 7 },
            { key: '30d',   label: '30 Days', days: 30 },
            { key: 'all',   label: 'All Time', days: null },
        ];
        let currentRange = 'all';

        // The metric fields we sum across daily buckets.
        const FIELDS = ['pageViews', 'gamesStarted', 'gamesSubmitted', 'accounts'];

        function startForDays(days) {
            const d = new Date();
            d.setUTCDate(d.getUTCDate() - (days - 1)); // inclusive of today
            return ymd(d);
        }

        // Fetch the numbers for a range. 'all' reads the cumulative doc; the others
        // sum the per-day buckets (which only exist from the day daily tracking began).
        async function fetchStats(range) {
            if (range === 'all') {
                const doc = await db.collection('stats').doc('global').get();
                const s = doc.exists ? doc.data() : {};
                const ts = s.updatedAt && s.updatedAt.toDate ? s.updatedAt.toDate() : null;
                return { s, sub: ts ? ('Last activity: ' + ts.toLocaleString()) : 'No activity recorded yet.', note: 'All-time totals since launch.' };
            }
            const days = RANGES.find(r => r.key === range).days;
            const end = ymd(new Date());
            const start = startForDays(days);
            const snap = await db.collection('statsDaily').where('date', '>=', start).where('date', '<=', end).get();
            const s = {};
            snap.forEach(d => { const data = d.data(); for (const k of FIELDS) s[k] = (s[k] || 0) + (data[k] || 0); });

            // Honesty note: if daily tracking started after the window opens, say so.
            let noteText = `${start} → ${end} · UTC`;
            try {
                const first = await db.collection('statsDaily').orderBy('date').limit(1).get();
                const earliest = first.empty ? null : first.docs[0].id;
                if (earliest && earliest > start) noteText += ` · daily data from ${earliest}`;
            } catch { /* note is best-effort */ }
            const label = RANGES.find(r => r.key === range).label;
            return { s, sub: `${label} — buckets summed per UTC day`, note: noteText };
        }

        function render(s) {
            const started = s.gamesStarted || 0, submitted = s.gamesSubmitted || 0;
            const views = s.pageViews || 0, accts = s.accounts || 0;
            const rate = started ? Math.round((submitted / started) * 100) : 0;
            const boards = submitted ? (started / submitted).toFixed(1) : '—';
            const perView = views ? (started / views).toFixed(1) : '—';
            const tiles = [
                { k: 'Page Views', v: fmt(views) },
                { k: 'Games Started', v: fmt(started) },
                { k: 'Games Submitted', v: fmt(submitted) },
                { k: 'Accounts Created', v: fmt(accts) },
                { k: 'Completion Rate<small>submitted ÷ started</small>', v: rate + '%', wide: true },
                { k: 'Boards Per Finished Game<small>started ÷ submitted — shuffles before a run</small>', v: boards, wide: true },
                { k: 'Boards Per Visit<small>started ÷ page views — engagement</small>', v: perView, wide: true },
            ];
            grid.innerHTML = tiles.map(t =>
                '<div class="tile' + (t.wide ? ' wide' : '') + '">' +
                '<div class="k">' + t.k + '</div><div class="v">' + t.v + '</div></div>'
            ).join('');
        }

        async function load() {
            updated.textContent = 'Loading…';
            note.textContent = '';
            try {
                const { s, sub, note: noteText } = await fetchStats(currentRange);
                render(s);
                updated.textContent = sub;
                note.textContent = noteText;
            } catch (e) {
                updated.textContent = 'Could not load stats: ' + e.message;
                grid.innerHTML = '';
            }
        }

        function renderRanges() {
            rangesEl.innerHTML = RANGES.map(r =>
                '<button data-range="' + r.key + '"' + (r.key === currentRange ? ' class="active"' : '') + '>' + r.label + '</button>'
            ).join('');
            rangesEl.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
                currentRange = b.dataset.range;
                renderRanges();
                load();
            }));
        }

        function unlock() {
            gate.style.display = 'none';
            dash.classList.add('on');
            renderRanges();
            load();
        }

        if (sessionStorage.getItem('reflAnalyticsAuthed') === '1') unlock();

        document.getElementById('gateForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (document.getElementById('pw').value === PASSWORD) {
                sessionStorage.setItem('reflAnalyticsAuthed', '1');
                err.textContent = '';
                unlock();
            } else {
                err.textContent = 'Incorrect password.';
                document.getElementById('pw').value = '';
            }
        });
        document.getElementById('refresh').addEventListener('click', load);
        document.getElementById('lock').addEventListener('click', () => {
            sessionStorage.removeItem('reflAnalyticsAuthed');
            location.reload();
        });
    </script>
</body>
</html>
